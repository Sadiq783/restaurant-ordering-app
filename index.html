<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Food</title>

    <link rel="stylesheet" href="index.css" />

    <script src="index.js" type="module" defer></script>

    <!-- Font Awesome  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <h1>Jimmy’s Diner</h1>
      <p>The best burgers and pizzas in town.</p>
    </header>

    <main>
      <div class="container">
        <div class="menu" id="menu"></div>
      </div>
    </main>
    <div class="container order-container" id="order-container" hidden>
      <h2>Your order</h2>
      <div id="order-item-container"></div>
      <hr />
      <div class="total-price">
        <p>Total price:</p>
        <p class="price" id="total-price">$0</p>
      </div>
      <button class="complete-order-btn" id="complete-order-btn">
        Complete order
      </button>
    </div>
  </body>
</html>
